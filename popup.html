<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Meeting Availability Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Google Sans', Roboto, Arial, sans-serif;
      font-size: 13px;
      color: #202124;
      width: 280px;
      padding: 16px;
      background: #fff;
    }
    .header { display: flex; align-items: center; margin-bottom: 14px; gap: 8px; }
    .header-icon { font-size: 22px; }
    .header-title { font-size: 15px; font-weight: 500; }
    .section { margin-bottom: 14px; }
    .label { color: #5f6368; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
    .value { font-size: 13px; font-weight: 500; }
    .tier-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
    }
    .tier-free { background: #e8f0fe; color: #1a73e8; }
    .tier-paid { background: #e6f4ea; color: #188038; }
    .tier-byok { background: #fef7e0; color: #f9ab00; }
    .usage-bar {
      height: 4px;
      background: #dadce0;
      border-radius: 2px;
      overflow: hidden;
      margin: 6px 0 4px;
    }
    .usage-bar-fill { height: 100%; background: #1a73e8; border-radius: 2px; }
    .usage-text { font-size: 11px; color: #5f6368; }
    .divider { border: none; border-top: 1px solid #dadce0; margin: 12px 0; }
    .link-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 4px;
      color: #1a73e8;
      text-decoration: none;
      font-size: 13px;
      cursor: pointer;
      background: none;
      border: none;
      width: 100%;
      text-align: left;
      font-family: inherit;
    }
    .link-btn:hover { background: #f1f3f4; }
    #status-loading { color: #5f6368; font-size: 12px; }
  </style>
</head>
<body>
  <div class="header">
    <span class="header-icon">📅</span>
    <span class="header-title">Find a Time</span>
  </div>

  <div id="status-loading">Loading…</div>
  <div id="status-content" style="display:none">
    <div class="section">
      <div class="label">Account</div>
      <div id="popup-email" class="value" style="margin-bottom:4px"></div>
      <span class="tier-badge" id="popup-tier-badge"></span>
    </div>

    <div class="section" id="popup-usage-section" style="display:none">
      <div class="usage-bar"><div class="usage-bar-fill" id="popup-usage-fill"></div></div>
      <div class="usage-text" id="popup-usage-text"></div>
    </div>
  </div>

  <button class="link-btn" id="sign-in-btn" style="display:none">
    🔑 Sign in with Google
  </button>

  <hr class="divider">

  <button class="link-btn" id="open-options">
    ⚙️ Settings
  </button>
  <a class="link-btn" href="https://mail.google.com" target="_blank" rel="noopener noreferrer">
    ✉️ Open Gmail
  </a>

  <script src="popup.js"></script>
</body>
</html>
