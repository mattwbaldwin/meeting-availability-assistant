<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meeting Availability Assistant — Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Google Sans', Roboto, Arial, sans-serif;
      font-size: 14px;
      color: #202124;
      background: #f8f9fa;
      min-height: 100vh;
      padding: 32px;
    }
    .container { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 22px; font-weight: 400; color: #202124; margin-bottom: 24px; }
    .card {
      background: #fff;
      border: 1px solid #dadce0;
      border-radius: 8px;
      padding: 20px 24px;
      margin-bottom: 16px;
    }
    .card h2 { font-size: 15px; font-weight: 500; margin-bottom: 14px; color: #202124; }
    .field { margin-bottom: 16px; }
    label { display: block; font-size: 13px; color: #5f6368; margin-bottom: 6px; }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #dadce0;
      border-radius: 4px;
      font-size: 13px;
      color: #202124;
      outline: none;
    }
    input:focus { border-color: #1a73e8; }
    .hint { font-size: 12px; color: #5f6368; margin-top: 5px; }
    .hint a { color: #1a73e8; }
    .btn {
      background: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 9px 18px;
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
    }
    .btn:hover { background: #1557b0; }
    .btn-secondary {
      background: #fff;
      color: #1a73e8;
      border: 1px solid #dadce0;
    }
    .btn-secondary:hover { background: #f1f3f4; }
    #save-status { font-size: 13px; color: #188038; margin-left: 12px; opacity: 0; transition: opacity 0.3s; }
    #save-status.visible { opacity: 1; }
    .account-row { display: flex; align-items: center; justify-content: space-between; }
    .account-info { font-size: 13px; }
    .account-email { font-weight: 500; }
    .tier-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
    }
    .tier-free { background: #e8f0fe; color: #1a73e8; }
    .tier-paid { background: #e6f4ea; color: #188038; }
    .tier-byok { background: #fef7e0; color: #f9ab00; }
    .usage-bar-wrap { margin-top: 10px; }
    .usage-bar {
      height: 4px;
      background: #dadce0;
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 4px;
    }
    .usage-bar-fill { height: 100%; background: #1a73e8; border-radius: 2px; transition: width 0.4s; }
    .usage-label { font-size: 12px; color: #5f6368; }
    #account-loading { color: #5f6368; font-size: 13px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚙️ Meeting Assistant Settings</h1>

    <!-- Account / Tier -->
    <div class="card">
      <h2>Account</h2>
      <div id="account-loading">Loading account info…</div>
      <div id="account-info" style="display:none">
        <div class="account-row">
          <div class="account-info">
            <div class="account-email" id="account-email"></div>
            <span class="tier-badge" id="tier-badge"></span>
          </div>
          <button class="btn btn-secondary" id="sign-out-btn" style="display:none">Sign out</button>
        </div>
        <div class="usage-bar-wrap" id="usage-wrap" style="display:none">
          <div class="usage-bar"><div class="usage-bar-fill" id="usage-bar-fill"></div></div>
          <div class="usage-label" id="usage-label"></div>
        </div>
        <p style="margin-top:12px;font-size:12px;color:#5f6368" id="upgrade-hint" style="display:none"></p>
      </div>
    </div>

    <!-- Display Name -->
    <div class="card">
      <h2>Your Name</h2>
      <div class="field">
        <label for="user-name">Display name (used to sign replies)</label>
        <input type="text" id="user-name" placeholder="e.g. Sarah">
      </div>
    </div>

    <!-- BYOK API Key -->
    <div class="card">
      <h2>Bring Your Own API Key (optional)</h2>
      <div class="field">
        <label for="api-key">Anthropic API key</label>
        <input type="password" id="api-key" placeholder="sk-ant-…">
        <p class="hint">
          Optional. If provided, all Claude calls go directly from your browser using your key —
          bypassing the free tier limit.<br>
          Get a key at <a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a>.
        </p>
      </div>
    </div>

    <div style="display:flex;align-items:center">
      <button class="btn" id="save-btn">Save Settings</button>
      <span id="save-status">✓ Saved</span>
    </div>
  </div>

  <script src="options.js"></script>
</body>
</html>
